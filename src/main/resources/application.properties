spring.application.name=ecorank

# Porta do servidor (o Render informa a porta na variavel PORT)
server.port=${PORT:8080}

# Conexao com o Oracle: NAO coloque usuario/senha neste arquivo.
# Defina as variaveis de ambiente DB_URL, DB_USERNAME e DB_PASSWORD
# (veja o README). Sem elas a aplicacao nao inicia, de proposito.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexoes pequeno para nao estourar o limite do banco
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Upload das fotos/videos de comprovacao (o servico valida 10 MB para foto e 25 MB para video)
spring.servlet.multipart.max-file-size=26MB
spring.servlet.multipart.max-request-size=27MB

# Origens do front-end aceitas pelo CORS: variavel de ambiente CORS_ORIGINS
# (separadas por virgula). Sem ela, so os enderecos locais de desenvolvimento.
